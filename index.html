<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100b26">
  <title>Ruleta de premios</title>

  <!-- Tipografía -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">

  <!-- Estilos CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Luces de fondo -->
  <div class="lights-bg">
    <div class="light light-1"></div>
    <div class="light light-2"></div>
    <div class="light light-3"></div>
    <div class="light light-4"></div>
  </div>

  <canvas id="confettiCanvas"></canvas>

  <h1>Breaking Desing</h1>

  <div class="wrap">
    <!-- Aguja -->
    <div class="pointer-box" id="pointer">
      <svg viewBox="0 0 40 54" aria-hidden="true">
        <defs>
          <linearGradient id="ptrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff4365"/>
            <stop offset="100%" stop-color="#b80c38"/>
          </linearGradient>
        </defs>
        <path d="M20 54 L3 10 Q20 -4 37 10 Z" fill="url(#ptrGrad)" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/>
        <circle cx="20" cy="14" r="5" fill="#ffffff" opacity="0.9"/>
      </svg>
    </div>

    <!-- Ruleta -->
    <svg id="wheel" viewBox="0 0 400 400" role="img" aria-label="Ruleta de la suerte"></svg>
  </div>

  <button id="spin" type="button">¡Girar!</button>

  <!-- Modal -->
  <div id="modal" role="dialog" aria-modal="true" aria-live="polite">
    <div class="card">
      <div class="icon-preview" id="rIcon"></div>
      <h2 id="rTitle"></h2>
      <p id="rText"></p>
      <button id="close" type="button">Seguir jugando</button>
    </div>
  </div>

  <!-- Lógica JS vinculada -->
  <script src="script.js"></script>
</body>
</html>
